<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Cartagena</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container { padding: 40px; text-align: center; font-family: 'Arial', sans-serif; }
        .login-box { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fff; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .login-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%; }
        .login-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div id="admin-content" style="display: none;">
            <h1>Owner Dashboard</h1>
            <p id="welcome-msg">Welcome back!</p>
            <button onclick="logout()" class="login-btn" style="background: #dc3545;">Logout</button>
        </div>

        <div id="login-section" class="login-box">
            <h2>Owner Login</h2>
            <input type="email" id="admin-email" placeholder="Owner Email">
            <input type="password" id="admin-pass" placeholder="Password">
            <button class="login-btn" onclick="signIn()">Access Dashboard</button>
            <p><a href="index.html" style="text-decoration:none; color:#666; font-size:14px;">← Back to Home</a></p>
        </div>
    </div>

    <script>
        // Use your verified credentials from the screenshots
        const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
        const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';
        
        // This is where the error was—ensure it is only declared ONCE here.
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function signIn() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-pass').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Login failed: " + error.message);
            } else {
                checkUser(); 
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const adminContent = document.getElementById('admin-content');
            const loginSection = document.getElementById('login-section');

            if (user) {
                adminContent.style.display = 'block';
                loginSection.style.display = 'none';
                document.getElementById('welcome-msg').innerText = `Welcome back, ${user.email}!`;
            } else {
                adminContent.style.display = 'none';
                loginSection.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
