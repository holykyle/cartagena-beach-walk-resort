<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Cartagena</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container { padding: 40px; text-align: center; font-family: 'Arial', sans-serif; }
        .login-box { max-width: 400px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fff; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .login-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%; }
        .login-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div id="admin-content" style="display: none;">
            <h1>Owner Dashboard</h1>
            <p id="welcome-msg">Welcome back!</p>
            <button onclick="logout()" class="login-btn" style="background: #dc3545;">Logout</button>
        </div>

        <div id="login-section" class="login-box">
            <h2>Owner Login</h2>
            <input type="email" id="admin-email" placeholder="Owner Email">
            <input type="password" id="admin-pass" placeholder="Password">
            <button class="login-btn" onclick="signIn()">Access Dashboard</button>
            <p><a href="index.html" style="text-decoration:none; color:#666; font-size:14px;">← Back to Home</a></p>
        </div>
    </div>

    <script>
        // Use your verified credentials from the screenshots
      const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// --- NEW: Fetch Bookings Function ---
async function fetchBookings() {
    const container = document.getElementById('bookings-container');
    
    const { data, error } = await supabaseClient
        .from('bookings')
        .select('*');

    if (error) {
        container.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = `<p>No bookings found in the database yet.</p>`;
        return;
    }

    let html = `
        <table style="width:100%; border-collapse: collapse; margin-top:20px; text-align:left;">
            <thead style="background:#f4f4f4;">
                <tr>
                    <th style="padding:10px; border:1px solid #ddd;">Guest Name</th>
                    <th style="padding:10px; border:1px solid #ddd;">Check In</th>
                    <th style="padding:10px; border:1px solid #ddd;">Check Out</th>
                    <th style="padding:10px; border:1px solid #ddd;">Room</th>
                </tr>
            </thead>
            <tbody>`;

    data.forEach(res => {
        html += `
            <tr>
                <td style="padding:10px; border:1px solid #ddd;">${res.guest_name}</td>
                <td style="padding:10px; border:1px solid #ddd;">${res.check_in}</td>
                <td style="padding:10px; border:1px solid #ddd;">${res.check_out}</td>
                <td style="padding:10px; border:1px solid #ddd;">${res.room_type}</td>
            </tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
}

// Update checkUser to call the fetch function
async function checkUser() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    const adminContent = document.getElementById('admin-content');
    const loginSection = document.getElementById('login-section');

    if (user) {
        adminContent.style.display = 'block';
        loginSection.style.display = 'none';
        document.getElementById('welcome-msg').innerText = `Logged in as: ${user.email}`;
        fetchBookings(); // Load the data immediately
    } else {
        adminContent.style.display = 'none';
        loginSection.style.display = 'block';
    }
}

async function signIn() {
    const email = document.getElementById('admin-email').value;
    const password = document.getElementById('admin-pass').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
    else checkUser();
}

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.reload();
}

document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
