<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Cartagena</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="admin-container">
        <div id="admin-content" style="display: none;">
            <h1>Owner Dashboard</h1>
            <p>Welcome back! You are logged in as the owner.</p>
            <hr>
            <div class="dashboard-tools">
                <p>Manage your resort bookings and room availability here.</p>
                <button onclick="logout()" class="login-btn logout-btn">Logout</button>
            </div>
        </div>

        <div id="login-section">
            <h2>Owner Login</h2>
            <p>Access the Cartagena management panel.</p>
            
            <input type="email" id="admin-email" placeholder="Owner Email">
            <input type="password" id="admin-pass" placeholder="Password">
            
            <button class="login-btn" onclick="signIn()">Access Dashboard</button>
            
            <br><br>
            <a href="index.html" style="color: #666; text-decoration: none; font-size: 0.85rem;">← Back to Home</a>
        </div>
    </div>

    <script src="js/admin-script.js"></script>

    <script>
const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';

// Initialize Supabase Client
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// DOM Elements
const adminContent = document.getElementById('admin-content');
const loginSection = document.getElementById('login-section');

// Function: Sign In logic
async function signIn() {
    const email = document.getElementById('admin-email').value;
    const password = document.getElementById('admin-pass').value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
    });

    if (error) {
        alert("Login failed: " + error.message);
    } else {
        // Success: checkUser will handle the view swap
        checkUser(); 
    }
}

// Function: Logout logic
async function logout() {
    await supabase.auth.signOut();
    window.location.reload(); // Refresh to lock the screen
}

// Function: Check if user is already logged in (Persistence)
async function checkUser() {
    const { data: { user } } = await supabase.auth.getUser();

    if (user) {
        adminContent.style.display = 'block';
        loginSection.style.display = 'none';
        document.getElementById('welcome-msg').innerText = `Welcome back, ${user.email}!`;
    } else {
        adminContent.style.display = 'none';
        loginSection.style.display = 'block';
    }
}

// Run the check as soon as the page loads
document.addEventListener('DOMContentLoaded', checkUser);

// Allow pressing "Enter" to submit
document.getElementById('admin-pass').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') signIn();
});
    </script>
</body>
</html>
