<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartagena | Book Your Stay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header">
        <div class="hero-content-wrapper">
            <section class="text-content">
                <div class="reserved-form">
                    <h2>Book Your Stay</h2>
                    <form>
                        <div class="input-group">
                            <label>Check-In</label>
                            <input type="date" value="2026-04-02">
                        </div>
                        <div class="input-group">
                            <label>Check-Out</label>
                            <input type="date" value="2026-04-25">
                        </div>
                        <div class="input-group">
                            <label>Guests</label>
                            <select id="guests-select">
                                <option value="2">2 Persons</option>
                                <option value="3">5 Persons</option>
                                <option value="4">6 Persons</option>
                                <option value="4">10 Persons</option>
                            </select>
                        </div>
                        
                        <a href="private-rooms.html?occupancy=2" id="room-btn" class="submit-reservation">AVAILABLE ROOM</a>
                            <a href="index.html" class="back-btn">← Back to Home</a>
                             <a href="open-cottages.html" id="cottage-btn" class="submit-reservation">AVAILABLE COTTAGE</a>
                    </form>
                </div>
            </section>
        </div>
    </header>

   <script>
        const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
        const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 3. Combined Function to Save to Database then Redirect
        async function saveAndGo(type) {
            const name = document.getElementById('guest-name').value;
            const checkin = document.getElementById('check-in').value;
            const checkout = document.getElementById('check-out').value;
            const guests = document.getElementById('guests-select').value;

            if (!name) {
                alert("Please enter your name to continue.");
                return;
            }

            // Prepare data for the 'bookings' table
            const bookingData = {
                guest_name: name,
                check_in: checkin,
                check_out: checkout,
                room_type: type === 'room' ? 'Private Room' : 'Open Cottage',
                guests_count: guests
            };

            // Insert into Supabase
            const { error } = await supabaseClient
                .from('bookings')
                .insert([bookingData]);

            if (error) {
                console.error("Error:", error);
                alert("Could not save booking: " + error.message);
            } else {
                alert("Booking saved! Redirecting to selection...");
                // Redirect based on the button clicked
                const targetPage = type === 'room' ? 'private-rooms.html' : 'open-cottages.html';
                window.location.href = `${targetPage}?occupancy=${guests}`;
            }
        }
    </script>
</body>
</html>
