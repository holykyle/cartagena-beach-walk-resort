<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartagena | Book Your Stay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header">
        <div class="hero-content-wrapper">
            <section class="text-content">
                <div class="reserved-form">
                    <h2>Book Your Stay</h2>
                    <form id="search-form">
                        <div class="input-group">
                            <label>Check-In</label>
                            <input type="date" id="check-in" value="2026-04-02">
                        </div>
                        <div class="input-group">
                            <label>Check-Out</label>
                            <input type="date" id="check-out" value="2026-04-25">
                        </div>
                        <div class="input-group">
                            <label>Accommodation Type</label>
                            <select id="room-type-select">
                                <option value="Private-Room">Private Room</option>
                                <option value="Open-Cottage">Open Cottage</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Guests</label>
                            <select id="guests-select">
                                <option value="2">2 Persons</option>
                                <option value="5">5 Persons</option>
                                <option value="10">10 Persons</option>
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                            <button type="button" onclick="search()" class="submit-reservation">CHECK AVAILABILITY</button>
                            <a href="index.html" class="back-btn">← Back to Home</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </header>

    <script>
       function search() {
    const checkin = document.getElementById('check-in').value;
    const checkout = document.getElementById('check-out').value;
    const guests = document.getElementById('guests-select').value;
    const roomType = document.getElementById('room-type-select').value;

    // This selects whether to go to private-rooms.html or open-cottages.html
    const targetPage = (roomType === 'Private-Room') ? 'private-rooms.html' : 'open-cottages.html';

    // The URL now carries every piece of info needed for the dashboard
    window.location.href = `${targetPage}?checkin=${checkin}&checkout=${checkout}&occupancy=${guests}`;
}
    </script>
</body>
</html>
