<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartagena | Book Your Stay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header">
        <div class="hero-content-wrapper">
            <section class="text-content">
                <div class="reserved-form">
                    <h2>Book Your Stay</h2>
                    <form>
                        <div class="input-group">
                            <label>Check-In</label>
                            <input type="date" value="2026-04-02">
                        </div>
                        <div class="input-group">
                            <label>Check-Out</label>
                            <input type="date" value="2026-04-25">
                        </div>
                        <div class="input-group">
                            <label>Guests</label>
                            <select id="guests-select">
                                <option value="2">2 Persons</option>
                                <option value="3">5 Persons</option>
                                <option value="4">6 Persons</option>
                                <option value="4">10 Persons</option>
                            </select>
                        </div>
                        
                        <a href="private-rooms.html?occupancy=2" id="room-btn" class="submit-reservation">AVAILABLE ROOM</a>
                            <a href="index.html" class="back-btn">← Back to Home</a>
                             <a href="open-cottages.html" id="cottage-btn" class="submit-reservation">AVAILABLE COTTAGE</a>
                    </form>
                </div>
            </section>
        </div>
    </header>

   <script>
        // Select the dropdown and both buttons
        const guestSelect = document.getElementById('guests-select');
        const roomBtn = document.getElementById('room-btn');
        const cottageBtn = document.getElementById('cottage-btn');

        // Function to update both links at once
        function updateLinks() {
            const guests = guestSelect.value;
            
            // Updates the URL for both buttons dynamically
            roomBtn.href = `private-rooms.html?occupancy=${guests}`;
            cottageBtn.href = `open-cottages.html?occupancy=${guests}`;
        }

        // Listen for changes on the dropdown
        guestSelect.addEventListener('change', updateLinks);
    </script>
</body>
</html>
