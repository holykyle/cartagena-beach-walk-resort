<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartagena | Book Your Stay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero-header">
        <div class="hero-content-wrapper">
            <section class="text-content">
                <div class="reserved-form">
                    <h2>Book Your Stay</h2>
                    <form>
                        <div class="input-group">
                            <label>Check-In</label>
                            <input type="date" value="2026-04-02">
                        </div>
                        <div class="input-group">
                            <label>Check-Out</label>
                            <input type="date" value="2026-04-25">
                        </div>
                        <div class="input-group">
                            <label>Guests</label>
                            <select id="guests-select">
                                <option value="2">2 Persons</option>
                                <option value="3">5 Persons</option>
                                <option value="4">6 Persons</option>
                                <option value="4">10 Persons</option>
                            </select>
                        </div>
                            <div class="input-group">
                             <label>Room Type</label>
                                <select id="type-select">
                            <option value="private-rooms.html">Private Room</option>
                             <option value="open-cottage.html">Open Cottage</option>
                            </select>
                        </div>
                        
                        <a href="private-rooms.html?occupancy=2" id="availability-btn" class="submit-reservation">AVAILABLE ROOM</a>
                        <a href="open-cottages.html" id="availability-btn" class="submit-reservation">AVAILABLE COTTAGE</a>
                    </form>
                </div>
            </section>
        </div>
    </header>

   <script>
    // 1. Declare variables ONLY ONCE
    const guestSelect = document.getElementById('guests-select');
    const typeSelect = document.getElementById('type-select');
    const availBtn = document.getElementById('availability-btn');

    // 2. Define a single function to handle the link update
    function updateLink() {
        const page = typeSelect.value;   // Gets 'private-rooms.html' or 'open-cottage.html'
        const guests = guestSelect.value; // Gets '1', '2', '3', or '4'
        
        // Combines them into a dynamic URL
        availBtn.href = `${page}?occupancy=${guests}`;
    }

    // 3. Add listeners to both dropdowns
    guestSelect.addEventListener('change', updateLink);
    typeSelect.addEventListener('change', updateLink);
</script>
</body>
</html>
