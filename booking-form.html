<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartagena | Book Your Stay</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="hero-header">
        <div class="hero-content-wrapper">
            <section class="text-content">
                <div class="reserved-form">
                    <h2>Book Your Stay</h2>
                    <form id="booking-form">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" id="guest-name" placeholder="Enter your name" required>
                        </div>

                        <div class="input-group">
                            <label>Check-In</label>
                            <input type="date" id="check-in" value="2026-04-02">
                        </div>

                        <div class="input-group">
                            <label>Check-Out</label>
                            <input type="date" id="check-out" value="2026-04-25">
                        </div>

                        <div class="input-group">
                            <label>Guests</label>
                            <select id="guests-select">
                                <option value="2">2 Persons</option>
                                <option value="5">5 Persons</option>
                                <option value="6">6 Persons</option>
                                <option value="10">10 Persons</option>
                            </select>
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                            <button type="button" onclick="saveAndGo('room')" class="submit-reservation">AVAILABLE ROOM</button>
                            <button type="button" onclick="saveAndGo('cottage')" class="submit-reservation">AVAILABLE COTTAGE</button>
                            <a href="index.html" class="back-btn">← Back to Home</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </header>

    <script>
        // 6. INITIALIZE: These must match your Supabase project settings
        const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
        const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function saveAndGo(type) {
            // Get values from the IDs added above
            const name = document.getElementById('guest-name').value;
            const checkin = document.getElementById('check-in').value;
            const checkout = document.getElementById('check-out').value;
            const guests = document.getElementById('guests-select').value;

            if (!name) {
                alert("Please enter your name to continue.");
                return;
            }

            // Prepare data - ensure these match your Supabase column names!
            const bookingData = {
                guest_name: name,
                check_in: checkin,
                check_out: checkout,
                room_type: type === 'room' ? 'Private Room' : 'Open Cottage'
                // Note: If your table doesn't have a 'guests_count' column, 
                // remove the line below or add the column in Supabase
                // guests_count: guests 
            };

            // 7. INSERT: Sends data to the "bookings" table
            const { error } = await supabaseClient
                .from('bookings')
                .insert([bookingData]);

            if (error) {
                console.error("Error:", error);
                alert("Could not save booking: " + error.message);
            } else {
                alert("Booking saved to database!");
                // Redirect based on the button clicked
                const targetPage = type === 'room' ? 'private-rooms.html' : 'open-cottages.html';
                window.location.href = `${targetPage}?occupancy=${guests}`;
            }
        }
    </script>
</body>
</html>
