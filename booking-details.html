<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complete Your Reservation | Cartagena Beach Walk Resort</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="booking-page-bg">
    <div class="booking-wrapper">
        <section class="details-card">
            <header class="form-header">
                <h2>Complete Your Reservation</h2>
                <p class="resort-location"><strong>Cartagena Beach Walk Resort</strong><br>📍 Brgy. Guiwang, Alcoy, Cebu, Philippines</p>
            </header>

            <div class="selection-summary">
                <p id="selected-room-display">You are booking: <span>Cartagena Beachwalk Resort</span></p>
            </div>

            <form id="final-booking-form">
                <input type="hidden" id="hidden-room-input">
                <input type="hidden" id="hidden-checkin">
                <input type="hidden" id="hidden-checkout">
                <input type="hidden" id="hidden-guests">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="guest-name" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="guest-email" placeholder="email@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="guest-phone" placeholder="0912 345 6789" required>
                    </div>
                </div>

                <div class="address-section">
                    <label class="section-label">Home Address</label>
                    <div class="input-group">
                        <input type="text" id="home-address" placeholder="Street / House No. / Subdivision" required>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" id="home-city" placeholder="City / Municipality" required>
                        </div>
                        <div class="input-group">
                            <input type="text" id="home-province" placeholder="Province" required>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="submit-reservation">CONFIRM BOOKING</button>
            </form>

            <a href="booking-form.html" class="back-btn">← Back to Rooms</a>
        </section>
    </div>

    <script>
        // 1. Initialize Supabase Client
        const supabaseUrl = 'https://xtayczurhnjuhmtszcly.supabase.co'; 
        const supabaseKey = 'sb_publishable_1ZtSjtYn2IAsPZUL1wuDQw_lah-tbbT';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Extract Data from URL on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            const checkin = params.get('checkin');
            const checkout = params.get('checkout');
            const guests = params.get('guests');

            if (room) {
                const cleanName = room.replace(/-/g, ' ');
                document.querySelector('#selected-room-display span').innerText = cleanName;
                document.getElementById('hidden-room-input').value = cleanName;
            }

            if (checkin) document.getElementById('hidden-checkin').value = checkin;
            if (checkout) document.getElementById('hidden-checkout').value = checkout;
            if (guests) document.getElementById('hidden-guests').value = guests;
        });

        // 3. Handle Form Submission
    document.getElementById('final-booking-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const params = new URLSearchParams(window.location.search);

    const roomTypeValue =
        document.getElementById('hidden-room-input').value ||
        params.get('room')?.replace(/-/g, ' ');

    const guestsValue =
        document.getElementById('hidden-guests').value ||
        params.get('guests');

    const checkInDate = params.get('checkin');
    const checkOutDate = params.get('checkout');

    // TOTAL ROOM COUNTS
    const isCottage = roomTypeValue.toLowerCase().includes('cottage');

    const totalRooms = isCottage ? 5 : 12;

    // GET EXISTING BOOKINGS
    const { data: existingBookings, error: bookingError } =
        await supabaseClient
            .from('bookings')
            .select('*');

    if (bookingError) {
        alert('Failed to check availability.');
        return;
    }

    // CHECK OVERLAPPING BOOKINGS
    const overlappingBookings = existingBookings.filter(b => {

        const sameType = isCottage
            ? (b.room_type || '').toLowerCase().includes('cottage')
            : !(b.room_type || '').toLowerCase().includes('cottage');

        if (!sameType) return false;

        const existingCheckIn = new Date(b.check_in);
        const existingCheckOut = new Date(b.check_out);

        const requestedCheckIn = new Date(checkInDate);
        const requestedCheckOut = new Date(checkOutDate);

        // DATE OVERLAP CHECK
        return (
            requestedCheckIn < existingCheckOut &&
            requestedCheckOut > existingCheckIn
        );
    });

    // FULLY BOOKED CHECK
    if (overlappingBookings.length >= totalRooms) {

        alert(
            isCottage
                ? 'All cottages are fully booked for the selected dates.'
                : 'All private rooms are fully booked for the selected dates.'
        );

        return;
    }

    // BOOKING DATA
    const bookingData = {
        guest_name: document.getElementById('guest-name').value,
        email: document.getElementById('guest-email').value,
        phone_number: document.getElementById('guest-phone').value,
        home_address: document.getElementById('home-address').value,
        city: document.getElementById('home-city').value,
        province: document.getElementById('home-province').value,
        room_type: roomTypeValue,
        check_in: checkInDate,
        check_out: checkOutDate,
        guests_count: parseInt(guestsValue, 10) || 0
    };

    // INSERT BOOKING
    const { error } = await supabaseClient
        .from('bookings')
        .insert([bookingData]);

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Booking Confirmed! See you at Cartagena.");
        window.location.href = "index.html";
    }
});
    </script>
</body>
</html>
